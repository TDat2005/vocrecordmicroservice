

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================

  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - content-service
      - frontend
    networks:
      - groove-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - groove-net
    restart: unless-stopped

  # ==========================================
  # DATABASES (6 isolated MySQL containers)
  # ==========================================

  mysql-auth:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_PASS}
      MYSQL_DATABASE: ${AUTH_DB_NAME}
    volumes:
      - auth-db-data:/var/lib/mysql
      - ./services/auth/database:/docker-entrypoint-initdb.d
    ports:
      - "3310:3306"
    networks:
      - groove-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-user:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${USER_DB_PASS}
      MYSQL_DATABASE: ${USER_DB_NAME}
    volumes:
      - user-db-data:/var/lib/mysql
      - ./services/user/database:/docker-entrypoint-initdb.d
    ports:
      - "3311:3306"
    networks:
      - groove-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-product:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${PRODUCT_DB_PASS}
      MYSQL_DATABASE: ${PRODUCT_DB_NAME}
    volumes:
      - product-db-data:/var/lib/mysql
      - ./services/product/database:/docker-entrypoint-initdb.d
    ports:
      - "3312:3306"
    networks:
      - groove-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-order:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_PASS}
      MYSQL_DATABASE: ${ORDER_DB_NAME}
    volumes:
      - order-db-data:/var/lib/mysql
      - ./services/order/database:/docker-entrypoint-initdb.d
    ports:
      - "3313:3306"
    networks:
      - groove-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-payment:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${PAYMENT_DB_PASS}
      MYSQL_DATABASE: ${PAYMENT_DB_NAME}
    volumes:
      - payment-db-data:/var/lib/mysql
      - ./services/payment/database:/docker-entrypoint-initdb.d
    ports:
      - "3314:3306"
    networks:
      - groove-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-content:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${CONTENT_DB_PASS}
      MYSQL_DATABASE: ${CONTENT_DB_NAME}
    volumes:
      - content-db-data:/var/lib/mysql
      - ./services/content/database:/docker-entrypoint-initdb.d
    ports:
      - "3315:3306"
    networks:
      - groove-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # APPLICATION SERVICES
  # ==========================================

  auth-service:
    build: ./services/auth
    env_file: .env
    depends_on:
      mysql-auth:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/auth/src:/app/src
    networks:
      - groove-net
    restart: unless-stopped

  user-service:
    build: ./services/user
    env_file: .env
    depends_on:
      mysql-user:
        condition: service_healthy
    volumes:
      - ./services/user/src:/app/src
    networks:
      - groove-net
    restart: unless-stopped

  product-service:
    build: ./services/product
    env_file: .env
    depends_on:
      mysql-product:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/product/src:/app/src
    networks:
      - groove-net
    restart: unless-stopped

  order-service:
    build: ./services/order
    env_file: .env
    depends_on:
      mysql-order:
        condition: service_healthy
    volumes:
      - ./services/order/src:/app/src
    networks:
      - groove-net
    restart: unless-stopped

  payment-service:
    build: ./services/payment
    env_file: .env
    depends_on:
      mysql-payment:
        condition: service_healthy
    volumes:
      - ./services/payment/src:/app/src
    networks:
      - groove-net
    restart: unless-stopped

  notification-service:
    build: ./services/notification
    env_file: .env
    volumes:
      - ./services/notification/src:/app/src
    networks:
      - groove-net
    restart: unless-stopped

  content-service:
    build: ./services/content
    env_file: .env
    depends_on:
      mysql-content:
        condition: service_healthy
    volumes:
      - ./services/content/src:/app/src
    networks:
      - groove-net
    restart: unless-stopped

  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    build: ./frontend
    networks:
      - groove-net
    restart: unless-stopped

# ==========================================
# VOLUMES & NETWORKS
# ==========================================

volumes:
  redis-data:
  auth-db-data:
  user-db-data:
  product-db-data:
  order-db-data:
  payment-db-data:
  content-db-data:

networks:
  groove-net:
    driver: bridge
